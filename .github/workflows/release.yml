name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archives
        run: |
          set -euo pipefail
          repo="${{ github.event.repository.name }}"
          mkdir -p dist

          for variant in dark light; do
            tmp="$(mktemp -d)"
            cp "m3e-${variant}.css" "$tmp/"
            (cd "$tmp" && zip -q "$GITHUB_WORKSPACE/dist/${repo}-${variant}.zip" ./*)
          done

          for f in dist/*.zip; do echo "== $f"; unzip -l "$f"; done
          (cd dist && sha512sum ./*.zip) | sed 's#\./##' | tee checksums.txt
          {
            echo "### SHA-512"
            echo '```'
            cat checksums.txt
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --generate-notes \
            --notes-file release-notes.md